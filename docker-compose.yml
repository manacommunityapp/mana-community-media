version: "3.9"

services:
  media-db:
    image: postgres:16-alpine
    container_name: mana-media-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mana_media
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - media-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mana_media"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mana-community-media
    restart: unless-stopped
    depends_on:
      media-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://media-db:5432/mana_media
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: mana-community-auth
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-mana-community-public}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-mana-community-private}
      CDN_BASE_URL: ${CDN_BASE_URL:-https://cdn.mana.community}
      MEDIA_MAX_FILE_SIZE: 50MB
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  media-db-data:
