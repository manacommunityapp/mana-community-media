spring:
  application:
    name: mana-community-media

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mana_media}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate           # Flyway manages schema; JPA only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MEDIA_MAX_FILE_SIZE:50MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:55MB}

server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ─── Media Service Configuration ─────────────────────────────────────────────

media:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-32-chars-min}
    issuer: ${JWT_ISSUER:mana-community-auth}

  s3:
    region: ${AWS_REGION:ap-south-1}
    bucket-public:  ${S3_BUCKET_PUBLIC:mana-community-public}
    bucket-private: ${S3_BUCKET_PRIVATE:mana-community-private}
    access-key:   ${AWS_ACCESS_KEY_ID:}
    secret-key:   ${AWS_SECRET_ACCESS_KEY:}
    cdn-base-url: ${CDN_BASE_URL:https://cdn.mana.community}
    presigned-url-ttl:    ${PRESIGNED_GET_TTL:PT15M}      # 15 minutes
    upload-presigned-ttl: ${PRESIGNED_PUT_TTL:PT5M}       # 5 minutes
    max-file-size-bytes:  ${MAX_FILE_BYTES:52428800}       # 50 MB
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
      - image/avif
      - video/mp4
      - video/webm
      - video/quicktime
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    image-variants:
      avatar:
        width: 300
        height: 300
        suffix: _avatar
      banner:
        width: 1200
        height: 400
        suffix: _banner
      thumbnail:
        width: 150
        height: 150
        suffix: _thumb

logging:
  level:
    com.manacommunity.media: INFO
    software.amazon.awssdk: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n"
